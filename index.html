<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>TOEFL Speaking Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow reading column (white page, blue headings, dark grey text), topic list like a course index, question cards for study. */
:root{
  --bg:#ffffff; --surface:#f6f8fb; --fg:#2f3640; --muted:#66707d; --head:#0b5cad; --link:#0b5cad;
  --line:#dde2e9; --accent-bg:#e8f1fb; --ok:#1c7c4a; --ok-bg:#e6f4ec; --fav:#b7791f; --focus:#0b5cad;
  --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a212a; --fg:#d6dce4; --muted:#9aa5b1; --head:#7db6ff; --link:#7db6ff;
  --line:#2c3541; --accent-bg:#1c2b3d; --ok:#6fd49a; --ok-bg:#16291f; --fav:#f0b955; --focus:#7db6ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a212a; --fg:#d6dce4; --muted:#9aa5b1; --head:#7db6ff; --link:#7db6ff;
  --line:#2c3541; --accent-bg:#1c2b3d; --ok:#6fd49a; --ok-bg:#16291f; --fav:#f0b955; --focus:#7db6ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
a{color:var(--link)}
h1,h2,h3{color:var(--head);line-height:1.25;text-wrap:balance;margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--head);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:16px}
nav a{text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
nav a[aria-current="page"]{border-bottom-color:var(--head);font-weight:600}
main{padding-top:28px}
.crumb{font-size:15px;color:var(--muted);margin-bottom:10px}
.hero h1{font-size:clamp(28px,5vw,40px);text-transform:uppercase;letter-spacing:.03em}
.hero .sub{font-size:20px;color:var(--fg);margin:6px 0 14px;font-weight:600}
.hero p{max-width:62ch;margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 30px;padding:0;list-style:none}
.stats li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stats b{display:block;font-size:28px;line-height:1.1;color:var(--head);font-variant-numeric:tabular-nums}
.stats span{font-size:14px;color:var(--muted)}
.search{display:flex;gap:10px;align-items:center;margin:0 0 6px}
.search input{flex:1;min-width:0;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.count{font-size:14px;color:var(--muted);margin:0 0 8px}
.topics{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.topics li{border-bottom:1px solid var(--line)}
.topics a.row{display:grid;grid-template-columns:96px 1fr auto;gap:4px 14px;align-items:baseline;padding:14px 4px;text-decoration:none;color:inherit}
.topics a.row:hover{background:var(--surface)}
.topics .num{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.topics .name{color:var(--link);font-size:19px;font-weight:600;text-decoration:underline;text-underline-offset:3px;min-width:0}
.topics .meta{font-size:14px;color:var(--muted);white-space:nowrap;text-align:right}
.topics .meta .done{color:var(--ok);font-weight:600}
.empty{padding:22px 4px;color:var(--muted)}
.section-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:34px}
.section-links a{display:block;border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-decoration:none;color:inherit}
.section-links a:hover{background:var(--surface)}
.section-links strong{display:block;color:var(--head);font-size:18px}
.section-links span{font-size:15px;color:var(--muted)}
.pagehead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.pagehead h1{font-size:clamp(24px,4.4vw,32px)}
.progress{font-size:15px;color:var(--muted);margin:6px 0 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 18px;max-width:320px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 14px;font-size:15px;text-decoration:none;color:var(--link);display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--head);border-color:var(--head);color:var(--bg);font-weight:600}
.btn.primary:hover{opacity:.92;background:var(--head)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.card{border:1px solid var(--line);border-radius:8px;padding:20px 20px 18px;margin:0 0 20px;background:var(--bg);scroll-margin-top:16px}
.card .kicker{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.qtext{font-size:21px;font-weight:600;color:var(--fg);margin:2px 0 14px;line-height:1.4}
.ans-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin:0 0 8px}
.ans-head h3{font-size:16px}
.tag{font-size:13px;background:var(--accent-bg);color:var(--head);border-radius:20px;padding:2px 10px;white-space:nowrap}
.answer{background:var(--surface);border-left:3px solid var(--head);border-radius:0 6px 6px 0;padding:14px 16px;margin:0 0 14px}
.answer p{margin:0;font-size:18px;line-height:1.7;max-width:64ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:15px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--ok);margin:0}
.check.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.favbtn[aria-pressed="true"]{border-color:var(--fav);color:var(--fav);font-weight:600}
.qnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.topicnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin:26px 0 0}
.models{display:grid;gap:16px}
.model{border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.model h2{font-size:20px;margin-bottom:10px}
.model ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.model li{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline}
.model li b{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.model li span{min-width:0}
.fav-item{margin-bottom:20px}
.fav-item .from{font-size:14px;margin-bottom:6px}
.practice{max-width:640px;margin:0 auto;text-align:center}
.practice .qtext{font-size:clamp(22px,4.5vw,30px);margin:14px 0 26px;text-align:center}
.clock{font-size:clamp(64px,16vw,96px);font-weight:700;color:var(--head);font-variant-numeric:tabular-nums;line-height:1;margin:6px 0 4px}
.clock.end{color:var(--ok)}
.tstate{color:var(--muted);font-size:15px;min-height:24px;margin:0 0 16px}
.practice .actions{justify-content:center}
.practice .answer{text-align:left;margin-top:24px}
.vtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px}
.vtools .search{flex:1 1 220px;margin:0}
.vlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.vrow{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.vrow .n{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.vrow .w{font-weight:600;color:var(--head);font-size:18px}
.vrow .m{color:var(--fg)}
.vrow .m button{background:var(--accent-bg);color:var(--head);border:0;border-radius:14px;padding:3px 12px;font-size:14px}
.vrow.learned .w{color:var(--ok)}
.vrow label{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.vrow input{width:18px;height:18px;accent-color:var(--ok);margin:0}
.vhead{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) auto;gap:14px;padding:8px 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:560px){.vhead{display:none}.vrow{grid-template-columns:30px 1fr auto}.vrow .m{grid-column:2 / -1}}
.kw{margin:10px 0 0!important;font-size:15px!important;color:var(--muted);line-height:1.5!important}.kw b{color:var(--head);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;margin-right:6px}
.topics li.grp{padding:20px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){
  body{font-size:16px}
  .topics a.row{grid-template-columns:1fr auto}
  .topics .num{grid-column:1 / -1}
  .model li{grid-template-columns:1fr;gap:0}
  .card{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Ask AI helper, bottom left */
.askfab[hidden],.askpanel[hidden],[hidden]{display:none!important}
.askfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;display:inline-flex;align-items:center;gap:8px;background:var(--head);color:var(--bg);border:0;border-radius:999px;padding:12px 18px;font-weight:600;font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.askfab:hover{opacity:.93}
.askpanel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:30;width:min(440px,calc(100vw - 32px));height:min(640px,calc(100% - 32px));display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 28px rgba(0,0,0,.28);overflow:hidden}
.askhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.askhead strong{color:var(--head);font-size:16px}
.askhead .sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.askmsgs{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:94%;padding:9px 12px;border-radius:10px;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.user{white-space:pre-wrap}
.msg.bot{max-width:100%;width:100%}
.msg.bot>:first-child{margin-top:0}.msg.bot>:last-child{margin-bottom:0}
.msg p{margin:0 0 .7em}.msg h4,.msg h5,.msg h6{color:var(--head);margin:.9em 0 .35em;font-size:1em}
.msg ul,.msg ol{margin:0 0 .7em;padding-left:1.4em}.msg li{margin:.15em 0}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--accent-bg);padding:1px 5px;border-radius:4px}
.msg pre{background:var(--accent-bg);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:0 0 .7em}
.msg pre code{background:none;padding:0}
.msgtools{display:flex;gap:8px;margin-top:6px}
.msgtools button{background:none;border:0;color:var(--muted);font-size:13px;padding:2px 4px;text-decoration:underline}
.msg.user{align-self:flex-end;background:var(--head);color:var(--bg)}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.err{align-self:flex-start;color:var(--fav);font-size:14.5px;background:transparent;padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--accent-bg);color:var(--head);border:0;border-radius:16px;padding:6px 12px;font-size:14px}
.askform{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line)}
.askform textarea{flex:1;min-width:0;resize:none;line-height:1.4;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);max-height:110px}
.askform .btn{padding:8px 14px}
.keybox{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);display:grid;gap:8px;font-size:14.5px}
.keybox input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
.keybox p{margin:0}
@media (max-width:560px){.askpanel{height:min(75%,540px)}}
</style>

<div class="wrap">
  <header class="topbar">
    <a class="brand" href="#home">TOEFL Speaking Practice</a>
    <nav aria-label="Main">
      <a href="#home" data-nav="home">Topics</a>
      <a href="#vocabulary" data-nav="vocabulary">Vocabulary</a>
      <a href="#models" data-nav="models">Speaking Structures</a>
      <a href="#favourites" data-nav="favourites">Favourites <span id="favCount"></span></a>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
</div>

<button class="askfab" id="askFab" type="button" aria-expanded="false" aria-controls="askPanel" hidden>Ask AI</button>
<section class="askpanel" id="askPanel" aria-label="Ask AI helper" hidden>
  <div class="askhead"><div><strong>Ask AI</strong><span class="sub">Ask anything, like a chat assistant</span></div>
    <div style="display:flex;gap:6px"><button class="btn" type="button" id="askKey" hidden>API key</button><button class="btn" type="button" id="askNew">New chat</button><button class="btn" type="button" id="askClose" aria-label="Close assistant">Close</button></div></div>
  <div class="askmsgs" id="askMsgs" aria-live="polite"></div>
  <form class="askform" id="askForm">
    <label class="sr" for="askInput">Type your message</label>
    <textarea id="askInput" rows="2" placeholder="Message Ask AI (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="btn primary" type="submit" id="askSend">Ask</button>
    <button class="btn" type="button" id="askStop" hidden>Stop</button>
  </form>
</section>

<script>
/* ---------- Content (kept apart from the interface code) ---------- */
const TOPICS = [{"id": 1, "name": "Remote Work", "questions": [{"q": "Describe the last time you worked away from your usual place.", "a": "In my case, I prefer working at home. The main reason is that I can concentrate better. This means that I can finish my work without distractions. For example, I can study quietly in my room. As a result, I can complete my tasks more easily."}, {"q": "How do you react to remote work?", "a": "I would say that I prefer working from home to working in an office. The main reason is that I can concentrate better. This means that I can avoid noise and distractions. For example, I can study quietly in my room. Compared with an office, working from home is more comfortable for me."}, {"q": "Do remote workers get better work-life balance?", "a": "In my opinion, remote work can improve work-life balance. The main reason is that people save travel time. This means that they have more time for family and hobbies. For example, they can spend time with their families after work. Therefore, I believe remote work can make daily life better."}, {"q": "Should companies invest in virtual social events?", "a": "I think virtual social events are important because they connect remote workers. One major benefit is that employees can get to know each other. This is useful because it makes teamwork easier. For example, they can share ideas during online games. As a result, workers may feel happier and less isolated."}]}, {"id": 2, "name": "Celebrations", "questions": [{"q": "Describe a celebration you enjoyed.", "a": "In my case, I enjoy family celebrations. The main reason is that they make me happy. This means that we can spend quality time together. For example, we can enjoy food and take photos at a family gathering. As a result, we create wonderful memories."}, {"q": "Do you prefer small family celebrations or large parties?", "a": "I would say that I prefer small family celebrations to large parties. The main reason is that I feel more comfortable with people I know. This means that I can talk freely and enjoy the occasion. For example, I like sharing food and stories with my family. Compared with large parties, small gatherings help me relax."}, {"q": "Do celebrations build stronger relationships?", "a": "In my opinion, celebrations help people build stronger relationships. The main reason is that they bring family members and friends together. This means that people can talk and share stories. For example, relatives can meet at a family celebration. Therefore, I believe celebrations help people feel closer and more connected."}, {"q": "Are public celebrations important for a community?", "a": "I think public celebrations are important because they bring people together. One major benefit is that neighbours can meet and talk. This is useful because people can build friendships and trust. For example, communities can organise festivals with food and music. As a result, people may feel closer to their community."}]}, {"id": 3, "name": "Shopping Habits", "questions": [{"q": "Describe a recent shopping experience.", "a": "In my case, I recently bought a laptop online. The main reason is that I needed it for my studies. This means that I can compare different products before buying. For example, I can check prices and features on my phone. As a result, I can choose a suitable laptop more easily."}, {"q": "Do you prefer online shopping or shopping in stores?", "a": "I would say that I prefer online shopping to shopping in stores. The main reason is that it saves time. This means that I can compare products from home. For example, I can check prices on my phone without visiting crowded shops. Compared with shopping in stores, online shopping is more convenient for me."}, {"q": "Is online shopping a better option?", "a": "In my opinion, online shopping is usually the better option. The main reason is that it offers more choices. This means that people can compare prices and product features. For example, I can compare different laptops before buying one. Therefore, I believe online shopping helps people make better choices."}, {"q": "Is personalised AI shopping useful?", "a": "I think personalised AI shopping may be useful because it saves time. One major benefit is that it can suggest suitable products quickly. This is useful because people can find products more easily. For example, a store may recommend items based on previous searches. As a result, some people may like this service, but others may worry about privacy."}]}, {"id": 4, "name": "Language Learning", "questions": [{"q": "How do you practise a language?", "a": "In my case, I practise English every day. The main reason is that I want to improve my communication skills. This means that I can express my ideas more clearly. For example, I learn new words and practise speaking English aloud. As a result, I become more confident when speaking English."}, {"q": "Do you prefer daily practice or practising only sometimes?", "a": "I would say that I prefer practising English every day to studying only sometimes. The main reason is that regular practice helps me improve faster. This means that I can remember new words and correct my mistakes. For example, I practise speaking and repeat English sentences every day. Compared with occasional practice, daily practice is more effective for me."}, {"q": "Is learning another language useful?", "a": "In my opinion, learning another language is very useful. The main reason is that it improves communication skills. This means that people can express their ideas clearly and find more opportunities. For example, I am learning English to prepare for my studies and future career. Therefore, I believe learning another language can help people achieve their goals."}, {"q": "Should governments support language learning?", "a": "I think government support for language learning is important because it creates more opportunities. One major benefit is that people can improve their communication skills. This is useful because they can study and work more easily. For example, governments can provide free English classes and online lessons. As a result, more people can improve their English and prepare for better opportunities."}]}, {"id": 5, "name": "Smartphones", "questions": [{"q": "Describe the last time you used your phone for something important.", "a": "In my case, I recently used my phone to find an important location. The main reason is that I did not know the way. This means that my phone helped me find information quickly. For example, I used a map application to get directions. As a result, I reached the place easily and felt relaxed."}, {"q": "How do you react to your phone in daily life?", "a": "I would say that I find my phone useful, but sometimes distracting. The main reason is that I use it for many daily activities. This means that I can learn new things and communicate with others. For example, I use my phone to study and contact my family. Compared with a computer, my phone is easier to carry."}, {"q": "Do smartphones make life better?", "a": "In my opinion, smartphones make life easier. The main reason is that they save time. This means that we can find information and learn new things quickly. For example, students can watch online lessons and use study materials on their phones. Therefore, I believe smartphones are useful in daily life."}, {"q": "Should schools and workplaces encourage healthier phone habits?", "a": "I think healthy phone habits are important because they help people focus better. One major benefit is that people can avoid distractions. This is useful because they can finish their work more easily. For example, students can keep their phones away while studying. As a result, they can learn better and work faster."}]}, {"id": 6, "name": "Household Chores", "questions": [{"q": "Describe the last household task you did.", "a": "In my case, I recently cleaned my room at home. The main reason is that I wanted to keep my room clean. This means that I can study better and avoid distractions. For example, I cleaned my desk and arranged my books. As a result, I felt happy and comfortable in my room."}, {"q": "How do you feel about doing household chores?", "a": "I would say that I prefer doing simple household chores to difficult tasks. The main reason is that simple chores are easy to finish. This means that I can save time and avoid stress. For example, I enjoy cleaning my room and arranging my books. Compared with difficult tasks, simple chores make me feel more comfortable."}, {"q": "Do you prefer small daily tasks or one big clean-up?", "a": "I would say that I prefer doing small household tasks every day to cleaning everything at once. The main reason is that small daily tasks save time. This means that I can manage my daily activities more easily. For example, I clean my room for ten minutes every day. Compared with one big clean-up, doing small tasks every day is easier for me."}, {"q": "Should schools teach basic home skills?", "a": "In my opinion, schools should teach students basic household skills. The main reason is that these skills are useful in daily life. This means that students can do simple household tasks without help. For example, students can learn cooking and cleaning and simple repairs at school. Therefore, I believe these skills can make students more independent."}]}, {"id": 7, "name": "Physical Activity", "questions": [{"q": "Describe the last time you were physically active.", "a": "In my case, I recently played cricket with my friends. The main reason is that I wanted to stay healthy and active. This means that I can improve my fitness and reduce stress. For example, I usually play cricket with my friends in the evening. As a result, I feel energetic, relaxed, and happy."}, {"q": "How do you feel about being physically active?", "a": "In my case, I enjoy being physically active. The main reason is that exercise helps me feel energetic. This means that I can reduce stress and improve my mood. For example, I enjoy walking or playing cricket with my friends in my free time. As a result, I feel refreshed and can focus better on my studies."}, {"q": "Which is more important: exercise or a healthy diet?", "a": "In my opinion, regular exercise is very important for good health. The main reason is that exercise keeps our bodies strong. This means that we can improve our fitness and reduce stress. For example, playing cricket or walking every day can help people stay active and healthy. Therefore, I believe regular exercise is important, although a healthy diet is also necessary."}, {"q": "Will schools spend more time on physical education?", "a": "In my opinion, schools should provide more time for physical education. The main reason is that exercise is important for students' health. This means that students can stay active, improve their fitness, and reduce stress from studying. For example, schools can organise cricket matches and other sports activities. Therefore, I believe schools should balance academic subjects with physical education to support students' overall development."}]}, {"id": 8, "name": "Current Events", "questions": [{"q": "Do you prefer getting news online or reading newspapers?", "a": "I would say that I prefer online news. The main reason is that it saves time. This means that I can get information quickly on my phone. For example, I read headlines in my free time. Compared with newspapers, online news is more convenient."}, {"q": "How do you feel after reading the news?", "a": "In my case, I feel informed and confident after reading the news. The main reason is that news gives me useful information. This means that I can understand what is happening around me. For example, I follow technology, education, and job news. As a result, I feel more prepared."}, {"q": "Do you prefer national or international news?", "a": "In my opinion, international news is also important. The main reason is that countries are connected. This means that events in one country can affect others. For example, technology developed abroad can create worldwide opportunities. Therefore, I believe people should follow both."}, {"q": "Why is it important to understand the news you read?", "a": "I think understanding news is important because people need to know what is true. One major benefit is identifying false information. This is useful because people can avoid incorrect news. For example, teachers can show students reliable news websites. As a result, people become informed and responsible."}]}, {"id": 9, "name": "Education", "questions": [{"q": "Do you prefer online or in-person classes?", "a": "In my opinion, in-person classes are better for me. The main reason is that I can interact directly with teachers. This means that I can ask questions and discuss difficult subjects. For example, I can talk with my classmates and teachers during class. Therefore, I think in-person classes are more effective."}, {"q": "Is taking a gap year a good idea?", "a": "In my opinion, taking a gap year can be a good idea. The main reason is that students can explore their interests. This means that they can understand their career choices. For example, they can learn programming or get a part-time job. Therefore, I believe they can make better decisions."}, {"q": "Describe a time you disagreed with a classmate.", "a": "In my case, I once disagreed with a classmate during a college project. The main reason was that we had different ideas. This means that we needed to understand each other's opinions. For example, we discussed both ideas and selected the best solution. As a result, we completed the project successfully."}, {"q": "How do you remember important deadlines?", "a": "In my case, I use my phone calendar to remember deadlines. The main reason is that I do not want to forget them. This means that I can organise my study schedule. For example, I add assignment and exam dates to my calendar. As a result, I can complete tasks on time."}]}, {"id": 10, "name": "Reading Habits", "questions": [{"q": "Do you prefer fiction or non-fiction books?", "a": "I would say that I prefer non-fiction books. The main reason is that I can learn new things. This means that they improve my knowledge and vocabulary. For example, I read about technology and personal development. Compared with fiction, non-fiction is more useful for learning."}, {"q": "Do you prefer buying books online or in a bookstore?", "a": "I would say that I prefer buying books online. The main reason is that it saves time. This means that I can find books from home. For example, I can compare prices on my phone. Compared with visiting a store, online shopping is more convenient."}, {"q": "Describe something you read that caught your attention.", "a": "In my case, I recently read an article about AI. The main reason it caught my attention is that I am interested in technology. This means that I enjoy learning about new developments. For example, the article explained how AI can help students and programmers. As a result, I became more interested in AI."}, {"q": "Has social media reduced people's attention to reading?", "a": "In my opinion, too much social media can reduce attention. The main reason is that people become used to short videos. This means that they may find it difficult to focus on long articles. For example, students check social media while studying. Therefore, I believe people should reduce social media use and read more."}]}, {"id": 11, "name": "Social Media", "questions": [{"q": "Does social media have a positive or negative effect on people?", "a": "In my opinion, social media has both positive and negative effects. The main reason is that it helps communication. This means that people can stay connected and find information. For example, students can watch educational videos. Therefore, I believe social media is useful when people control their usage."}, {"q": "Describe a post or video that affected you.", "a": "In my case, I once saw a video about AI. The main reason it affected me is that I am interested in technology. This means that I like discovering new tools and ideas. For example, the video showed AI tools for programmers. As a result, I became more interested in AI skills."}, {"q": "How does social media fit into your daily routine?", "a": "In my case, I use social media in my free time. The main reason is that I want to stay connected and learn. This means that I can communicate and find information. For example, I use LinkedIn for job opportunities and professional updates. As a result, I stay informed and improve my knowledge."}, {"q": "Should children use social media?", "a": "In my opinion, children should have limited access rather than a complete ban. The main reason is that too much use can distract them. This means that they may spend less time studying or playing outside. For example, parents can set screen-time limits. Therefore, parental guidance is important."}]}, {"id": 12, "name": "Part-Time Jobs", "questions": [{"q": "Should students have part-time jobs?", "a": "In my opinion, students can work part-time while studying. The main reason is that they can earn money and gain experience. This means that they can learn practical skills. For example, they can work as a shop or computer assistant. Therefore, part-time work is helpful if students manage their study time."}, {"q": "What job would you like to do in the future?", "a": "In my case, I am interested in becoming a data analyst. The main reason is that I like data and technology. This means that I can use programming and problem-solving skills. For example, I can work with Python and SQL. As a result, I can build experience and develop my career."}, {"q": "How important is earning money?", "a": "In my case, earning money is important to me. The main reason is that I need it for daily expenses. This means that I can support myself and save for the future. For example, I can use it for travel, food, and study materials. As a result, earning money gives me independence."}, {"q": "Will AI make jobs harder for graduates?", "a": "In my opinion, AI may make some jobs harder for graduates. The main reason is that AI can perform basic tasks. This means that some companies may need fewer people for certain work. For example, AI can help with basic coding. Therefore, graduates should learn new technologies and practical skills."}]}, {"id": 13, "name": "Personal Finances", "questions": [{"q": "Describe an expensive item you bought.", "a": "In my case, I bought a laptop for my studies. The main reason is that I needed a study tool. This means that it helps me complete assignments and learn skills. For example, I use it for Python and online courses. As a result, it was a useful purchase."}, {"q": "Do you prefer saving money or spending money?", "a": "I would say that I prefer saving money. The main reason is that it helps me prepare for the future. This means that I can manage unexpected expenses. For example, I try to save some money every month. Compared with spending everything, saving gives me financial security."}, {"q": "How do you plan your expenses?", "a": "In my case, I plan my expenses. The main reason is that I want to avoid unnecessary spending. This means that I can save for important needs. For example, I check my monthly budget. As a result, I can manage my money responsibly."}, {"q": "Should schools teach personal finance?", "a": "I think personal finance education is important because it is a useful life skill. One major benefit is that students learn to save and spend wisely. This is useful because they can avoid money problems. For example, schools can teach budgeting and saving. As a result, students become financially responsible."}]}, {"id": 14, "name": "Transportation Preferences", "questions": [{"q": "What is your preferred way to travel in your city?", "a": "I would say that I prefer public transport. The main reason is that it saves money. This means that I do not need to pay for fuel or maintenance. For example, I can travel by bus or train. Compared with a private vehicle, public transport is more affordable."}, {"q": "How do you spend your time during a long journey?", "a": "In my case, I feel comfortable during long journeys. The main reason is that I can use my free time. This means that I can relax and avoid boredom. For example, I listen to music or watch videos on my phone. As a result, the journey feels more enjoyable."}, {"q": "Describe a long-distance trip you took.", "a": "In my case, I usually travel from Andhra Pradesh to Punjab by train to study at LPU University. The main reason is that my university is in Punjab, so the journey is very long. This means that I spend many hours on the train with my friends. For example, we listen to music, watch videos on our phones, and share our food with each other. As a result, the long journey feels enjoyable and we become closer as friends."}, {"q": "Do you prefer roads or public transport?", "a": "In my opinion, governments should invest more in public transport. The main reason is that many people depend on buses and trains. This means that better services make daily travel easier. For example, governments can improve bus and train services. Therefore, this helps students and workers."}]}, {"id": 15, "name": "Making Plans", "questions": [{"q": "Describe a detailed plan you made.", "a": "In my case, I made a study plan for an exam. The main reason is that I wanted to prepare properly. This means that I organised my subjects and time. For example, I divided topics into daily tasks. As a result, I studied in a more organised way."}, {"q": "Do you prefer detailed plans or being spontaneous?", "a": "I would say that I prefer making plans. The main reason is that it helps me stay organised. This means that I know which tasks I need to complete. For example, I prepare a daily timetable. Compared with deciding at the last minute, planning helps me manage time better."}, {"q": "How do you remember important dates?", "a": "In my case, I use my phone calendar. The main reason is that I do not want to forget important dates. This means that reminders help me stay organised. For example, I add assignment and exam dates. As a result, I can finish tasks on time."}, {"q": "Describe a plan that did not go as expected.", "a": "In my case, my assignment was not completed as planned. The main reason was that I needed more time to understand the topic. This means that other tasks were delayed. For example, I changed my timetable. As a result, I learned to allow extra time."}]}, {"id": 16, "name": "Smartphone Use Interview", "label": "Task 2", "group": "tasks", "questions": [{"q": "How do you use your smartphone in your daily routine?", "a": "In my case, I use my smartphone every day. The main reason is that it helps me with my daily activities. This means that I can communicate with friends and search for useful information. For example, I use my phone to watch educational videos and check messages. As a result, I can manage my daily activities more easily.", "model": 1}, {"q": "How do you manage screen time and avoid smartphone distractions?", "a": "I would say that I prefer limiting my smartphone usage during study time. The main reason is that I can concentrate better. This means that I can complete my tasks without unnecessary distractions. For example, I keep my phone away while studying. Compared with using my phone frequently, this habit is more productive.", "model": 2}, {"q": "Do smartphones negatively affect young adults' ability to concentrate on deep work?", "a": "In my opinion, smartphones can negatively affect concentration. The main reason is that notifications and social media create distractions. This means that students may lose focus while completing important tasks. For example, they may check their phones several times during studying. Therefore, I believe reducing smartphone usage can improve concentration.", "model": 3}, {"q": "What would your ideal relationship with technology look like?", "a": "I think having a balanced relationship with technology is important. One major benefit is that people can use technology for learning and communication. This is useful because it helps them improve their knowledge and skills. For example, students can watch educational videos instead of spending too much time on social media. As a result, they can use technology more productively.", "model": 4}]}, {"id": 17, "name": "Commuting to Campus Interview", "label": "Task 3", "group": "tasks", "questions": [{"q": "How do you travel to campus, and what does the trip involve?", "a": "In my case, I usually travel to campus by public transportation. The main reason is that it is affordable and convenient. This means that I can reach my destination without spending too much money. For example, I can take a bus to reach my college. As a result, I can manage my daily travel expenses more easily.", "model": 1}, {"q": "Do you have a favourite way to get to school, and why is it your top choice?", "a": "I would say that I prefer travelling by public transportation. The main reason is that it is cheaper than using a private vehicle. This means that I can save money on daily travel. For example, I can use a bus instead of spending money on fuel. Compared with private transportation, public transportation is more affordable for me.", "model": 2}, {"q": "Do you agree that public transportation is always the most efficient option for students?", "a": "In my opinion, public transportation is a good option for students. The main reason is that it is affordable and reduces traffic congestion. This means that students can travel without spending too much money. For example, they can use buses to reach their colleges. However, it may not be convenient for everyone. Therefore, I believe the best transportation option depends on individual needs.", "model": 3}, {"q": "If you could design an ideal commuting system, what changes would you make?", "a": "I think an affordable transportation system is important for students. One major benefit is that it makes daily travelling easier. This is useful because students can save both time and money. For example, colleges could provide more buses during busy hours and offer student discounts. As a result, students could travel more comfortably.", "model": 4}]}, {"id": 18, "name": "Study Preferences & Environment Design", "label": "Task 4", "group": "tasks", "questions": [{"q": "When and where do you prefer studying?", "a": "In my case, I prefer studying in the evening. The main reason is that I can concentrate better at that time. This means that I can understand difficult topics without many distractions. For example, I usually study quietly in my room. As a result, I can complete my study tasks more easily.", "model": 1}, {"q": "Do you prefer studying alone or with other students, and why?", "a": "I would say that I prefer studying alone to studying with friends. The main reason is that I can concentrate better. This means that I can focus on difficult subjects without interruptions. For example, I can prepare my study materials quietly in my room. Compared with group study, studying alone is more comfortable for me.", "model": 2}, {"q": "Do you agree that complete silence is the most effective way to learn?", "a": "In my opinion, a quiet environment can improve learning. The main reason is that students can concentrate without distractions. This means that they can understand difficult topics more easily. For example, I prefer studying in a quiet room instead of a noisy place. Therefore, I believe silence is helpful for effective learning.", "model": 3}, {"q": "How would you design your ideal study environment?", "a": "I think having a comfortable study environment is important. One major benefit is that students can concentrate better. This is useful because it helps them complete their assignments on time. For example, I would arrange a comfortable chair, a study table and proper lighting in my room. As a result, I could improve my productivity.", "model": 4}]}, {"id": 19, "name": "Activities & Weekend Planning", "label": "Task 5", "group": "tasks", "questions": [{"q": "What do you usually do during weekends, and how do you relax after classes?", "a": "In my case, I usually spend my weekends relaxing and enjoying different activities. The main reason is that I need some time to recover from my studies. This means that I can refresh my mind after a busy week. For example, I enjoy playing cricket and volleyball with my friends. As a result, I feel more energetic and relaxed.", "model": 1}, {"q": "What hobbies or activities do you enjoy the most, and why?", "a": "I would say that I prefer playing cricket and working out at the gym. The main reason is that these activities keep me physically active. This means that I can improve my fitness and maintain good health. For example, I usually play cricket with my friends during my free time. Compared with spending too much time on my phone, these activities are more productive.", "model": 2}, {"q": "Do you think students should completely relax or engage in productive hobbies during weekends?", "a": "In my opinion, students should balance relaxation and productive activities. The main reason is that continuous studying can create stress. This means that students need time to refresh their minds and develop new skills. For example, they can play sports or learn something interesting during weekends. Therefore, I believe balancing both activities is the best approach.", "model": 3}, {"q": "How would you design your ideal weekend schedule?", "a": "I think having a proper weekend schedule is important. One major benefit is that students can manage their free time effectively. This is useful because they can focus on both personal activities and learning. For example, I would exercise in the morning, complete my assignments in the afternoon and relax in the evening. As a result, I could improve my health and productivity.", "model": 4}]}, {"id": 20, "name": "Food Choices", "label": "Topic 1", "group": "int1", "questions": [{"q": "Can you tell me a little about your typical food choices here at college? What kinds of foods do you usually go for on a daily basis?", "a": "In my case, I usually prefer eating homemade food and simple meals at college. The main reason is that homemade food is healthy and affordable. This means that I can get proper nutrition without spending too much money. For example, I usually choose rice, vegetables and fresh fruits for my daily meals. As a result, I can stay healthy and maintain my energy throughout the day.", "model": 1}, {"q": "When you're deciding what to eat, what factors usually influence your choices the most? Do you prioritize taste, health, or convenience? And why?", "a": "I would say that I prefer healthy food to fast food. The main reason is that healthy food is better for my body. This means that I can maintain my energy and avoid health problems. For example, I prefer eating fresh fruits and homemade meals instead of burgers and pizza. Compared with fast food, healthy food is a better choice for my daily routine.", "model": 2}, {"q": "Some people say that college students often prioritize convenience over healthy eating due to busy schedules. Do you agree or disagree with this statement and why?", "a": "In my opinion, college students often choose convenience over healthy eating. The main reason is that they have busy schedules and limited time. This means that they may choose fast food instead of preparing healthy meals. For example, students sometimes buy burgers or snacks between classes. As a result, they may develop unhealthy eating habits. Therefore, I believe students should make time for healthy eating.", "model": 3}, {"q": "If you could design the ideal college dining experience to support healthy and enjoyable food choices for students, what changes would you make?", "a": "I think having a healthy and affordable college dining system is important. One major benefit is that students can enjoy nutritious meals every day. This is useful because it helps them maintain good health and concentrate better on their studies. For example, I would provide fresh fruits, vegetables, different meal options and affordable prices in the college cafeteria. As a result, students could enjoy healthy food and improve their eating habits.", "model": 4}]}, {"id": 21, "name": "Sleep Routines", "label": "Topic 2", "group": "int1", "questions": [{"q": "Can you tell me about your typical sleep schedule during the academic week, including when you usually go to bed and wake up?", "a": "In my case, I usually go to bed around 11 PM and wake up around 7 AM. The main reason is that I need enough rest for my daily activities. This means that I can feel fresh and concentrate better on my studies. For example, I try to avoid using my smartphone before going to bed. As a result, I can maintain a healthy sleep schedule and feel energetic throughout the day.", "model": 1}, {"q": "What challenges do you face in maintaining a consistent sleep routine and how do these difficulties impact your energy levels and daily academic performance?", "a": "I would say that I sometimes find it difficult to maintain a regular sleep schedule. The main reason is that I have assignments and spend time using my smartphone. This means that I sometimes go to bed late and feel tired the next morning. For example, I may spend extra time completing college work. Compared with getting enough sleep, sleeping late makes it difficult for me to concentrate on my studies.", "model": 2}, {"q": "Some people say that pulling all-nighters to study is sometimes necessary for university students. Do you agree or disagree with this statement and why?", "a": "In my opinion, staying awake all night to study is not a good habit. The main reason is that the body needs enough rest to function properly. This means that students may feel tired and lose concentration the next day. For example, students who study all night may find it difficult to remember information during exams. Therefore, I believe students should follow a proper study schedule instead of sacrificing their sleep.", "model": 3}, {"q": "If you could design your ideal sleep environment and routine as a student, what changes would you make to ensure better rest and overall well-being?", "a": "I think having a comfortable sleeping environment is important. One major benefit is that students can get better-quality sleep. This is useful because proper rest improves energy levels and concentration. For example, I would keep my bedroom quiet, maintain a comfortable temperature and avoid using my smartphone before bedtime. As a result, I could sleep peacefully and feel fresh the next morning.", "model": 4}]}, {"id": 22, "name": "Physical Activity", "label": "Topic 3", "group": "int1", "questions": [{"q": "Tell me about your typical exercise habits and how you usually stay physically active throughout the week.", "a": "In my case, I usually stay physically active by playing sports and doing simple exercises. The main reason is that physical activity helps me stay healthy and fit. This means that I can improve my fitness and reduce stress. For example, I enjoy playing cricket and volleyball with my friends during my free time. As a result, I feel more energetic and relaxed throughout the day.", "model": 1}, {"q": "What challenges do you often face when trying to maintain a consistent exercise routine and how do you typically overcome them?", "a": "I would say that managing time is my biggest challenge when trying to exercise regularly. The main reason is that I have academic responsibilities and other daily activities. This means that sometimes I do not get enough time for exercise. For example, I may skip the gym when I have important assignments. However, I try to follow a simple exercise schedule. Compared with avoiding exercise completely, even a short workout helps me stay active.", "model": 2}, {"q": "Some people believe that exercising should always be fun and enjoyable to be effective. Do you agree or disagree with this idea and why?", "a": "In my opinion, exercise should be enjoyable because it encourages people to stay active. The main reason is that people are more likely to continue activities they enjoy. This means that they can maintain a regular exercise routine without feeling bored. For example, students can play cricket, volleyball or go cycling with their friends. Therefore, I believe enjoyable activities can help people maintain good health.", "model": 3}, {"q": "If you could give one piece of advice to someone struggling to start or maintain a regular exercise routine, what would it be?", "a": "I think starting with simple exercises is important. One major benefit is that people can build healthy habits without putting too much pressure on themselves. This is useful because small activities can improve fitness over time. For example, I would suggest walking for 20 minutes every day and slowly increasing the exercise time. As a result, people can become more active and improve their health.", "model": 4}]}, {"id": 23, "name": "Social Media Habits", "label": "Topic 4", "group": "int1", "questions": [{"q": "Can you tell me about your personal social media habits, including which platforms you use most often and how frequently you check them?", "a": "In my case, I usually use social media every day, especially Instagram and YouTube. The main reason is that these platforms help me stay connected and learn new things. This means that I can communicate with friends and find useful information. For example, I watch educational videos on YouTube and check updates on Instagram. As a result, I can use social media for both entertainment and learning.", "model": 1}, {"q": "What challenges do you face in managing your social media use and how do you try to balance it with other daily activities?", "a": "I would say that avoiding distractions is my biggest challenge when using social media. The main reason is that short videos and notifications can take up a lot of time. This means that I may lose concentration while studying. For example, I sometimes check Instagram when I am completing assignments. However, I prefer limiting my smartphone usage during study time. Compared with using social media frequently, this habit is more productive.", "model": 2}, {"q": "Some people say that social media is generally more harmful than beneficial for young people's well-being. Do you agree or disagree with this statement and why?", "a": "In my opinion, excessive social media use can negatively affect young people's well-being. The main reason is that spending too much time online can increase stress and reduce concentration. This means that students may find it difficult to focus on their studies and daily activities. For example, they may spend several hours watching short videos instead of studying. Therefore, I believe people should reduce unnecessary social media usage and focus on productive activities.", "model": 3}, {"q": "If you could give one piece of advice to someone trying to establish healthier social media habits, what would it be and why?", "a": "I think limiting daily social media usage is important. One major benefit is that people can manage their time more effectively. This is useful because they can focus on studies, exercise and other important activities. For example, I would suggest keeping the smartphone away while studying and setting a daily screen-time limit. As a result, people can improve their concentration and develop healthier habits.", "model": 4}]}, {"id": 24, "name": "Shopping as a Student", "label": "Topic 5", "group": "int1", "questions": [{"q": "What are your typical shopping habits as a student? How often do you shop and what items do you usually look for?", "a": "In my case, I usually shop once or twice a month. The main reason is that I buy only what I need. This means that I can save money and time. For example, I buy clothes, snacks and study items. As a result, I can manage my money easily.", "model": 1, "k": "Once a month → need only → save money → clothes, snacks, study items"}, {"q": "When you need to buy something, do you prefer shopping online or in a physical store? What is the main reason for your choice?", "a": "I would say that I prefer online shopping to shopping in stores. The main reason is that it saves time. This means that I can compare prices on my phone. For example, I can order things from my room. Compared with shopping in stores, online shopping is more convenient for me.", "model": 2, "k": "Online → save time → compare prices on phone → order from room"}, {"q": "Some say price is the most important factor for students. Do you agree or disagree, and why?", "a": "In my opinion, price is the most important factor for students. The main reason is that students have a limited budget. This means that they need to save money. For example, I compare prices on my phone before I buy anything. Therefore, I believe students should choose good products at low prices.", "model": 3, "k": "Price → limited budget → save money → compare prices on phone"}, {"q": "If you could design an ideal shopping experience for students, what one feature would you include and why?", "a": "I think a student discount feature is important because students have little money. One major benefit is that they can save money. This is useful because they can spend it on study needs. For example, a shopping app can give discounts on books and clothes. As a result, students can shop easily and save money.", "model": 4, "k": "Student discount → save money → study needs → books and clothes"}]}, {"id": 25, "name": "Reading Habits & Digital Screens", "label": "Topic 6", "group": "int1", "questions": [{"q": "What types of materials do you usually read, and how often do you read them?", "a": "In my case, I usually read online articles and study materials on my phone. The main reason is that it is easy and convenient. This means that I can read at any time. For example, I read short articles in my free time. As a result, I learn new things every day.", "model": 1, "k": "Phone → articles → free time → learn every day"}, {"q": "What challenges do you face in making time for reading, and what materials do you prefer when your time is limited?", "a": "I would say that I prefer reading short articles to reading long books when my time is limited. The main reason is that I have little free time because of classes and assignments. This means that I can finish short articles quickly. For example, I read them on my phone between classes. Compared with long books, short articles are more convenient for me.", "model": 2, "k": "Little time → short articles → phone → between classes"}, {"q": "Do you agree or disagree that digital screens have made it more difficult for young adults to focus on long-form reading?", "a": "In my opinion, digital screens make long reading difficult for young adults. The main reason is that phones give notifications and short videos. This means that students lose focus easily. For example, I sometimes check my phone while I am reading. Therefore, I believe students should keep their phones away while reading.", "model": 3, "k": "Screens → notifications → lose focus → phone away"}, {"q": "What is one thing you would change about your own reading habits, or one strategy you would recommend to encourage more reading among young adults?", "a": "I think reading every day is important because it improves knowledge. One major benefit is that it improves English. This is useful because it helps students in their studies. For example, students can read for ten minutes every day with their phone notifications off. As a result, they can read more and focus better.", "model": 4, "k": "Read daily → improve English → ten minutes → notifications off"}]}, {"id": 26, "name": "Part-Time Work & Study", "label": "Topic 7", "group": "int1", "questions": [{"q": "What is your experience with working part-time while studying? Do you currently have a job or have you considered getting one?", "a": "In my case, I usually focus on my studies and I do not have a part-time job now. The main reason is that I have classes and assignments. This means that I do not have much free time. For example, I study in my room and play cricket with my friends. As a result, I can manage my studies well, but I may try a part-time job in the future.", "model": 1, "k": "Studies first → no job now → little free time → maybe in future"}, {"q": "What challenges do you face trying to balance part-time work with your studies and social life? How do you manage these competing demands?", "a": "I would say that I prefer making a timetable to doing everything at the last minute. The main reason is that it helps me manage my time. This means that I can balance study, work and friends. For example, I plan my daily tasks on my phone. Compared with last-minute work, a timetable is more helpful for me.", "model": 2, "k": "Timetable → manage time → balance → plan on phone"}, {"q": "Some believe working part-time significantly hurts a student's academic performance. Do you agree or disagree and why?", "a": "In my opinion, part-time work does not always hurt academic performance. The main reason is that students can learn time management. This means that they can use their time well. For example, a student can work a few hours and still study every day. Therefore, I believe part-time work is good if students manage their time.", "model": 3, "k": "Not always → time management → few hours → manage time"}, {"q": "If you could give one piece of advice to a fellow student considering part-time work, what would it be to help them succeed?", "a": "I think planning time is important for students who work part-time. One major benefit is that they can balance work and study. This is useful because they can finish assignments on time. For example, students can use a phone timetable and keep their work hours short. As a result, they can earn money and still do well in their studies.", "model": 4, "k": "Plan time → balance → assignments on time → short work hours"}]}, {"id": 27, "name": "Stress Management", "label": "Topic 8", "group": "int1", "questions": [{"q": "Can you describe your personal approach to stress management and the methods you use to cope with academic pressure and daily challenges?", "a": "In my case, I usually reduce stress by playing cricket with my friends. The main reason is that it makes me feel relaxed. This means that I can forget my worries. For example, I also listen to music in my room. As a result, I feel fresh and ready to study.", "model": 1, "k": "Cricket → friends → relaxed → music → fresh"}, {"q": "What specific challenges do you face when managing academic pressure during busy periods like exams, and how do you handle them?", "a": "I would say that I prefer making a study plan to studying at the last minute during exams. The main reason is that it reduces stress. This means that I can finish my subjects on time. For example, I divide my topics into daily tasks and keep my phone away. Compared with last-minute study, a study plan is more helpful for me.", "model": 2, "k": "Study plan → less stress → daily tasks → phone away"}, {"q": "Some people suggest taking frequent, short breaks throughout the day is more effective than one long break. Do you agree or disagree, and why?", "a": "In my opinion, short breaks are better than one long break. The main reason is that they keep the mind fresh. This means that students can focus again quickly. For example, I take a ten-minute break after studying for one hour. Therefore, I believe short breaks help students study better.", "model": 3, "k": "Short breaks → fresh mind → focus → ten minutes"}, {"q": "If you could design an ideal campus resource or program to help students manage stress, what would it look like and what would be its most important feature?", "a": "I think a stress-relief program is important for students. One major benefit is that students can relax. This is useful because they can focus better on their studies. For example, a campus can provide sports, music and a quiet room. As a result, students can feel happy and less stressed.", "model": 4, "k": "Stress program → relax → focus → sports, music, quiet room"}]}, {"id": 28, "name": "Cooking as a Student", "label": "Topic 9", "group": "int1", "questions": [{"q": "Can you tell me about your typical cooking habits as a student? How often do you cook for yourself and what kinds of meals do you usually prepare?", "a": "In my case, I usually cook simple meals like rice and vegetables a few times a week. The main reason is that homemade food is healthy and cheap. This means that I can save money. For example, I cook with my friends in my room. As a result, I eat healthy food and save money.", "model": 1, "k": "Simple meals → rice, vegetables → healthy and cheap → friends"}, {"q": "What challenges do you face when trying to cook for yourself as a busy student and how do you usually overcome them?", "a": "I would say that I prefer cooking simple meals to cooking difficult dishes. The main reason is that simple meals save time. This means that I can cook quickly after classes. For example, I make rice and vegetables in about thirty minutes. Compared with difficult dishes, simple meals are easier for me.", "model": 2, "k": "Busy → simple meals → save time → rice, vegetables"}, {"q": "Many students believe that home cooking is too time-consuming and expensive compared to eating out. Do you agree or disagree with this statement and why?", "a": "In my opinion, home cooking is cheaper than eating out. The main reason is that restaurant food costs more. This means that students can save money. For example, a homemade meal costs less than a burger or pizza. Therefore, I believe home cooking is a better choice for students.", "model": 3, "k": "Home cooking → cheaper → save money → burger, pizza"}, {"q": "If you could change one thing about your current cooking habits or facilities on campus, what would it be? And what advice would you give new students?", "a": "I think a shared kitchen is important for students. One major benefit is that students can cook healthy food easily. This is useful because they can save money. For example, new students can start with simple meals like rice and vegetables and cook together with friends. As a result, they can eat healthy food and make friends.", "model": 4, "k": "Shared kitchen → healthy → save money → simple meals with friends"}]}, {"id": 29, "name": "Clothing & Personal Style", "label": "Topic 10", "group": "int1", "questions": [{"q": "Can you tell me about your typical routine for getting dressed in the morning and how you usually choose what to wear for the day?", "a": "In my case, I usually wear simple and comfortable clothes. The main reason is that I want to save time in the morning. This means that I can get ready quickly. For example, I choose a shirt and jeans without thinking too much. As a result, I reach college on time.", "model": 1, "k": "Simple clothes → save time → shirt and jeans → on time"}, {"q": "What do you prioritize when choosing your daily outfits? Comfort, style, or cost? And what's the main reason behind your preference?", "a": "I would say that I prefer comfort to style. The main reason is that comfortable clothes help me feel relaxed. This means that I can focus on my classes. For example, I wear cotton shirts for the whole day. Compared with style, comfort is more important for me.", "model": 2, "k": "Comfort → relaxed → focus → cotton shirts"}, {"q": "Some people say that spending a lot of money on trendy clothes is a waste since styles change quickly. Do you agree or disagree and why?", "a": "In my opinion, spending a lot of money on trendy clothes is a waste. The main reason is that styles change quickly. This means that students cannot use the clothes for a long time. For example, a trendy shirt may look old after a few months. Therefore, I believe students should buy simple clothes at low prices.", "model": 3, "k": "Trendy → waste → styles change → simple and cheap"}, {"q": "If you could give one piece of advice to other university students about developing their personal style or managing their clothing budget, what would it be?", "a": "I think having a clothing budget is important for students. One major benefit is that they can save money. This is useful because they can spend it on study needs. For example, students can buy simple and comfortable clothes in a sale or online. As a result, they can look good and save money.", "model": 4, "k": "Clothing budget → save money → study needs → sale or online"}]}, {"id": 30, "name": "Music & Study Habits", "label": "Topic 11", "group": "int1", "questions": [{"q": "How often do you listen to music and what role does it play in your typical day as a student?", "a": "In my case, I usually listen to music every day on my phone. The main reason is that it makes me feel happy. This means that I can relax after classes. For example, I listen to music in my room and with my friends. As a result, I feel fresh and positive.", "model": 1, "k": "Every day → phone → happy → relax → friends"}, {"q": "When you're trying to focus on studying, what kind of music do you prefer to listen to, or do you avoid music altogether and why?", "a": "I would say that I prefer studying in silence to studying with loud music. The main reason is that I can concentrate better. This means that I can understand difficult topics easily. For example, I study quietly in my room. Compared with loud music, silence is more helpful for me.", "model": 2, "k": "Silence → concentrate → difficult topics → quiet room"}, {"q": "Some students believe that listening to music during breaks is essential for de-stressing and improving mood. Do you agree or disagree with this idea and why?", "a": "In my opinion, listening to music during breaks helps students relax. The main reason is that it reduces stress. This means that students can feel happy again. For example, I listen to music for ten minutes after studying. Therefore, I believe music is good for breaks.", "model": 3, "k": "Music in breaks → less stress → happy → ten minutes"}, {"q": "If you could give advice to other students about how to best incorporate music into their study and relaxation routines, what would you recommend?", "a": "I think using music at the right time is important. One major benefit is that students can relax and study better. This is useful because they can stay happy and focused. For example, students can listen to music during breaks and study in silence. As a result, they can balance relaxation and study.", "model": 4, "k": "Right time → relax and study → breaks → silence while studying"}]}];

const MODELS = [
  {n:1,title:"Personal Experience & Habits",steps:[
    ["Answer","In my case, I usually [activity]."],
    ["Reason","The main reason is that [reason]."],
    ["Explanation","This means that [explanation]."],
    ["Example","For example, [specific example]."],
    ["Ending","As a result, [result]."]]},
  {n:2,title:"Preference & Comparison",steps:[
    ["Answer","I would say that I prefer [option A] to [option B]."],
    ["Reason","The main reason is that [reason]."],
    ["Explanation","This means that [explanation]."],
    ["Example","For example, [specific example]."],
    ["Ending","Compared with [option B], [option A] is more [benefit] for me."]]},
  {n:3,title:"Opinion & Agree/Disagree",steps:[
    ["Answer","In my opinion, [opinion]."],
    ["Reason","The main reason is that [reason]."],
    ["Explanation","This means that [explanation]."],
    ["Example","For example, [specific example]."],
    ["Ending","Therefore, I believe [final opinion]."]]},
  {n:4,title:"Benefits & Importance",steps:[
    ["Answer","I think [topic] is important because [reason]."],
    ["Reason","One major benefit is that [benefit]."],
    ["Explanation","This is useful because [explanation]."],
    ["Example","For example, [specific example]."],
    ["Ending","As a result, [positive outcome]."]]}
];
const VOCAB = [["Adversely affects", "Harms something"], ["Adverse effect", "Negative result"], ["Negatively impacts", "Affects badly"], ["Constant exposure", "Continuous experience"], ["Put a strain on", "Create pressure"], ["Cognitive skills", "Thinking abilities"], ["Excessive", "Too much"], ["Excessively", "Too much (adverb)"], ["Weaken", "Make something less strong"], ["Reliance", "Dependence"], ["Independently", "Without help"], ["Beneficial", "Helpful"], ["Long-term health", "Health over many years"], ["Key to", "Very important for"], ["Plays an important role", "Helps something"], ["Be aware of", "Know about"], ["Become aware of", "Start understanding"], ["Raise awareness", "Help people understand"], ["Draw attention to", "Make people notice"], ["Promote awareness", "Encourage understanding"], ["Scarce", "Not enough"], ["Restricting", "Controlling access"], ["Certain", "Particular"], ["Authorities", "Official organisations"], ["Worldwide", "Across the world"], ["Shortage", "Lack of something"], ["Advise against", "Recommend not doing"], ["Warn about risks", "Explain dangers"], ["Discourage from", "Try to stop"], ["Distinct", "Clearly different"], ["Shrinking", "Becoming smaller"], ["Growing gap", "Increasing difference"]];
const ORD = ["One","Two","Three","Four"];
const TIMER_SECONDS = 45;

/* ---------- Saved progress (localStorage, with a safe fallback) ---------- */
const KEY = "toefl-speaking-hub-v1";
let store = {done:{}, fav:{}, vocab:{}};
try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); store = {done:p.done||{}, fav:p.fav||{}, vocab:p.vocab||{}}; } } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
const kid = (t,q) => t + "-" + q;
const isDone = (t,q) => !!store.done[kid(t,q)];
const isFav = (t,q) => !!store.fav[kid(t,q)];
function toggle(map,t,q){ const k = kid(t,q); if (store[map][k]) delete store[map][k]; else store[map][k] = true; save(); }
const topicLabel = T => T.label || ("Practice " + T.id);
const TOTALQ = TOPICS.reduce((n,T)=>n+T.questions.length,0);
const kwHTML = x => x.k ? '<p class="kw"><b>Keywords</b> ' + esc(x.k) + '</p>' : "";
const doneIn = t => TOPICS[t-1].questions.filter((_,i)=>isDone(t,i+1)).length;
const totalDone = () => Object.keys(store.done).length;
const totalFav = () => Object.keys(store.fav).length;

/* ---------- Helpers ---------- */
const $ = (s,r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = $("#app");
function modelOf(a){ return a.startsWith("In my case")?1 : a.startsWith("I would say")?2 : a.startsWith("In my opinion")?3 : 4; }
const modelName = n => MODELS[n-1].title;
let timerId = null, pendingScroll = null;
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }
function updateChrome(){
  $("#favCount").textContent = totalFav() ? "(" + totalFav() + ")" : "";
  const h = (location.hash.replace("#","") || "home");
  const cur = h.startsWith("topic")||h.startsWith("practice")||h==="home" ? "home" : h;
  document.querySelectorAll("nav a").forEach(a => a.getAttribute("data-nav")===cur ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
}

/* ---------- Pages ---------- */
function renderHome(){
  document.title = "TOEFL Speaking Practice";
  app.innerHTML =
   '<section class="hero"><h1>TOEFL Speaking Practice</h1>' +
   '<div class="sub">My Personal TOEFL Speaking Preparation Hub</div>' +
   '<p>Welcome to my TOEFL Speaking Practice Website. Practise all ' + TOPICS.length + ' topics, understand the questions, and improve your speaking confidence with simple and structured answers.</p></section>' +
   '<ul class="stats" aria-label="Summary">' +
     '<li><b>' + TOPICS.length + '</b><span>Total Topics</span></li><li><b>' + TOTALQ + '</b><span>Total Questions</span></li>' +
     '<li><b>4</b><span>Questions per Topic</span></li><li><b>4</b><span>Speaking Models</span></li>' +
     '<li><b id="doneStat">0</b><span>Completed of ' + TOTALQ + '</span></li></ul>' +
   '<h2 style="font-size:22px;margin-bottom:12px">All Topics</h2>' +
   '<div class="search"><label class="sr" for="q">Search topics by name</label>' +
   '<input id="q" type="search" placeholder="Search topics by name" autocomplete="off"></div>' +
   '<p class="count" id="count" aria-live="polite"></p>' +
   '<ul class="topics" id="list"></ul>' +
   '<div class="section-links"><a href="#vocabulary"><strong>Vocabulary</strong><span>32 useful words and phrases with simple meanings.</span></a><a href="#models"><strong>My Four Speaking Structures</strong><span>Revise the four answer models.</span></a>' +
   '<a href="#favourites"><strong>Favourite Questions</strong><span id="favLine"></span></a></div>';
  $("#doneStat").textContent = totalDone();
  $("#favLine").textContent = totalFav() ? totalFav() + " saved for quick revision." : "Star important questions to collect them here.";
  const input = $("#q");
  const draw = () => {
    const term = input.value.trim().toLowerCase();
    const hits = TOPICS.filter(t => (t.name + " " + topicLabel(t)).toLowerCase().includes(term));
    let lastGroup = null;
    $("#list").innerHTML = hits.map(t => {
      const d = doneIn(t.id), g = t.group || "topics";
      const head = g !== lastGroup ? '<li class="grp">' + (g === "tasks" ? "Interview Tasks 2 to 5" : g === "int1" ? "Interview Topics 1 to 11" : "My Speaking Topics") + '</li>' : "";
      lastGroup = g;
      return head + '<li><a class="row" href="#topic-' + t.id + '"><span class="num">' + esc(topicLabel(t)) + '</span><span class="name">' + esc(t.name) + '</span>' +
        '<span class="meta">' + t.questions.length + ' questions' + (d ? ' · <span class="done">' + d + '/' + t.questions.length + ' done</span>' : '') + '</span></a></li>';
    }).join("") || '<li class="empty">No topic matches “' + esc(input.value.trim()) + '”. Try another word.</li>';
    $("#count").textContent = term ? hits.length + " of " + TOPICS.length + " topics" : "";
  };
  input.addEventListener("input", draw);
  draw();
}

function answerBlock(t,i,open){
  const x = TOPICS[t-1].questions[i-1], m = x.model || modelOf(x.a);
  return '<div class="ans-head"><h3>My Structured Answer</h3><span class="tag">Model ' + m + ' · ' + esc(modelName(m)) + '</span></div>' +
    '<div class="answer" id="ans-' + t + '-' + i + '"' + (open?'':' hidden') + '><p>' + esc(x.a) + '</p>' + kwHTML(x) + '</div>';
}

function cardHTML(t,i){
  const x = TOPICS[t-1].questions[i-1];
  const prevLabel = i>1 ? "Previous Question" : (t>1 ? "Previous Topic" : "");
  const nextLabel = i<4 ? "Next Question" : (t<TOPICS.length ? "Next Topic" : "");
  return '<article class="card" id="q' + i + '" data-i="' + i + '">' +
    '<div class="kicker"><h2>Question ' + ORD[i-1] + '</h2><span>Question ' + i + ' of 4</span></div>' +
    '<div class="qtext">' + esc(x.q) + '</div>' +
    '<div class="ans-wrap" data-i="' + i + '">' + answerBlock(t,i,false) + '</div>' +
    '<div class="actions">' +
      '<button class="btn toggle" type="button" aria-expanded="false" aria-controls="ans-' + t + '-' + i + '" data-i="' + i + '">Show Answer</button>' +
      '<a class="btn primary" href="#practice-' + t + '-' + i + '">Practice</a>' +
      '<label class="check' + (isDone(t,i)?' on':'') + '"><input type="checkbox" class="done" data-i="' + i + '"' + (isDone(t,i)?' checked':'') + '> Completed</label>' +
      '<button class="btn favbtn" type="button" aria-pressed="' + isFav(t,i) + '" data-i="' + i + '">' + (isFav(t,i)?'★ Favourite':'☆ Favourite') + '</button>' +
    '</div>' +
    '<div class="qnav">' +
      (prevLabel ? '<button class="btn qprev" type="button" data-i="' + i + '">← ' + prevLabel + '</button>' : '<span></span>') +
      (nextLabel ? '<button class="btn qnext" type="button" data-i="' + i + '">' + nextLabel + ' →</button>' : '<span></span>') +
    '</div></article>';
}

function renderTopic(t){
  const T = TOPICS[t-1];
  document.title = T.name + " · TOEFL Speaking Practice";
  app.innerHTML =
    '<div class="crumb"><a href="#home">All topics</a> / ' + esc(topicLabel(T)) + '</div>' +
    '<div class="pagehead"><h1>TOEFL Speaking Interview – ' + esc(T.name) + '</h1></div>' +
    '<p class="progress" id="prog"></p><div class="bar" aria-hidden="true"><i id="barfill"></i></div>' +
    '<div class="toolbar"><button class="btn" type="button" id="showAll">Show All Answers</button>' +
    '<button class="btn" type="button" id="hideAll">Hide All Answers</button></div>' +
    [1,2,3,4].map(i => cardHTML(t,i)).join("") +
    '<div class="topicnav">' +
      (t>1 ? '<a class="btn" href="#topic-' + (t-1) + '">← Previous Topic: ' + esc(TOPICS[t-2].name) + '</a>' : '<span></span>') +
