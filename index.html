      (t<TOPICS.length ? '<a class="btn" href="#topic-' + (t+1) + '">Next Topic: ' + esc(TOPICS[t].name) + ' →</a>' : '<span></span>') +
    '</div>';
  const prog = () => {
    const d = doneIn(t);
    $("#prog").textContent = "Progress: " + d + " of 4 questions completed";
    $("#barfill").style.width = (d*25) + "%";
  };
  prog();
  const setOpen = (i,open) => {
    const box = $("#ans-" + t + "-" + i), b = app.querySelector('.toggle[data-i="' + i + '"]');
    box.hidden = !open; b.setAttribute("aria-expanded", String(open)); b.textContent = open ? "Hide Answer" : "Show Answer";
  };
  $("#showAll").onclick = () => [1,2,3,4].forEach(i => setOpen(i,true));
  $("#hideAll").onclick = () => [1,2,3,4].forEach(i => setOpen(i,false));
  app.querySelectorAll(".toggle").forEach(b => b.onclick = () => setOpen(+b.dataset.i, b.getAttribute("aria-expanded")!=="true"));

function renderPractice(t,i){
  const T = TOPICS[t-1], x = T.questions[i-1];
  document.title = "Practice · " + T.name;
  let remaining = TIMER_SECONDS, endAt = 0, state = "idle";
  app.innerHTML = '<div class="practice">' +
    '<div class="crumb"><a href="#topic-' + t + '">← Back to ' + esc(T.name) + '</a></div>' +
    '<div class="kicker" style="color:var(--muted);font-size:15px">' + esc(topicLabel(T)) + ' · ' + esc(T.name) + ' · Question ' + i + ' of 4</div>' +
    '<div class="qtext">' + esc(x.q) + '</div>' +
    '<div class="clock" id="clock" role="timer" aria-live="off">0:45</div>' +
    '<p class="tstate" id="tstate" aria-live="polite">Read the question, press Start, and answer aloud.</p>' +
    '<div class="actions"><button class="btn primary" type="button" id="start">Start</button>' +

    '<button class="btn" type="button" id="reset">Reset</button></div>' +
    '<div class="actions" style="margin-top:14px"><button class="btn" type="button" id="view" hidden>View my prepared answer</button></div>' +

    '<div class="actions" style="margin-top:22px"><label class="check' + (isDone(t,i)?' on':'') + '"><input type="checkbox" id="pdone"' + (isDone(t,i)?' checked':'') + '> Completed</label>' +
    (i<4 ? '<a class="btn" href="#practice-' + t + '-' + (i+1) + '">Next question →</a>' : '<a class="btn" href="#topic-' + t + '">Back to topic →</a>') + '</div></div>';
  const clock = $("#clock"), ts = $("#tstate");
  const show = s => { clock.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
  const tick = () => {
    remaining = Math.max(0, Math.ceil((endAt - Date.now())/1000)); show(remaining);
    if (remaining <= 0) finish();
  };
  function finish(){
    stopTimer(); state = "done"; remaining = 0; show(0);
    clock.classList.add("end"); ts.textContent = "Time is up. You can now check your prepared answer.";
    $("#start").disabled = true; $("#pause").disabled = true; $("#view").hidden = false;
  }
  $("#start").onclick = () => {
    if (state === "running") return;
    state = "running"; endAt = Date.now() + remaining*1000; stopTimer(); timerId = setInterval(tick, 200);
    ts.textContent = "Speaking… keep going until the timer ends.";
    $("#start").disabled = true; $("#pause").disabled = false;
  };

    if (state !== "running") return;

  };

    stopTimer(); state = "idle"; remaining = TIMER_SECONDS; show(remaining); clock.classList.remove("end");
    ts.textContent = "Read the question, press Start, and answer aloud.";
    $("#start").disabled = false; $("#start").textContent = "Start"; $("#pause").disabled = true;
    $("#view").hidden = true; $("#pans").hidden = true; $("#view").textContent = "View my prepared answer";
  };
  $("#view").onclick = () => { const p = $("#pans"); p.hidden = !p.hidden; $("#view").textContent = p.hidden ? "View my prepared answer" : "Hide my prepared answer"; };
  $("#pdone").onchange = e => { toggle("done",t,i); e.target.parentElement.classList.toggle("on", e.target.checked); };
}

function renderVocab(){
  document.title = "Vocabulary · TOEFL Speaking Practice";

    '<h1 style="font-size:clamp(24px,4.4vw,32px);margin-bottom:6px">Vocabulary: Words and Phrases</h1>' +

    '<p class="count" id="vcount" aria-live="polite"></p>' +

    '<ul class="vlist" id="vlist"></ul>';

  const draw = () => {
    const term = input.value.trim().toLowerCase(); let shownCount = 0;
    $("#vlist").innerHTML = VOCAB.map((v,i) => {

      shownCount++;
      const id = i + 1, learned = !!store.vocab[id], reveal = !hidden || shown.has(id);
      return '<li class="vrow' + (learned ? ' learned' : '') + '"><span class="n">' + id + '</span><span class="w">' + esc(v[0]) + '</span>' +
        '<span class="m">' + (reveal ? esc(v[1]) : '<button type="button" data-show="' + id + '">Show meaning</button>') + '</span>' +
        '<label><input type="checkbox" data-learn="' + id + '"' + (learned ? ' checked' : '') + '><span class="sr">Learned: ' + esc(v[0]) + '</span><span aria-hidden="true">Learned</span></label></li>';
    }).join("") || '<li class="empty">No word matches “' + esc(input.value.trim()) + '”.</li>';
    const done = Object.keys(store.vocab).length;
    $("#vcount").textContent = "Learned " + done + " of " + VOCAB.length + (term ? " · showing " + shownCount : "");
  };
  input.addEventListener("input", draw);
  $("#vhide").onclick = () => { hidden = !hidden; shown.clear(); $("#vhide").textContent = hidden ? "Show meanings" : "Hide meanings"; draw(); };
  $("#vlist").addEventListener("click", e => { const b = e.target.closest("[data-show]"); if (b) { shown.add(+b.dataset.show); draw(); } });
  $("#vlist").addEventListener("change", e => {
    const c = e.target.closest("[data-learn]"); if (!c) return;
    const id = +c.dataset.learn; if (c.checked) store.vocab[id] = true; else delete store.vocab[id]; save(); draw();
  });
  draw();
}

/* ---------- Router ---------- */
function route(){
  stopTimer();
  const h = location.hash.replace("#","") || "home";
  let m, scrollTo = null;
  if ((m = h.match(/^topic-(\d+)$/)) && +m[1]>=1 && +m[1]<=TOPICS.length) { renderTopic(+m[1]); if (pendingScroll) scrollTo = pendingScroll; }
  else if ((m = h.match(/^practice-(\d+)-(\d)$/)) && +m[1]>=1 && +m[1]<=TOPICS.length && +m[2]>=1 && +m[2]<=4) renderPractice(+m[1], +m[2]);
  else if (h === "models") renderModels();
  else if (h === "vocabulary") renderVocab();
  else if (h === "favourites") renderFavourites();
  else renderHome();
  updateChrome();
  if (scrollTo) { const c = $("#q"+scrollTo); if (c) { c.scrollIntoView({block:"start"}); c.setAttribute("tabindex","-1"); c.focus({preventScroll:true}); } }
  else window.scrollTo(0,0);
  pendingScroll = null;
}
window.addEventListener("hashchange", route);
route();

  $("#askKey").onclick=()=>{ if(ctl) ctl.abort(); apiKey=""; try{ localStorage.removeItem(KEYSTORE); }catch(e){} turns=[]; intro(); };
  form.onsubmit=e=>{ e.preventDefault(); ask(input.value); };
  input.addEventListener("input",()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,110)+"px"; });
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); ask(input.value); } if(e.key==="Escape") openPanel(false); });
  (async()=>{
    if(!window.claude){ mode="api"; $("#askKey").hidden=false; fab.hidden=false; return; }
    try{ sample = window.claude.use ? await window.claude.use("sample") : null; }catch(e){ sample=null; }
    if(sample){ mode="sample"; fab.hidden=false; }
  })();
})();
</script>

</body>
</html>
